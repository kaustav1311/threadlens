name: CI
on: [push, pull_request]

# Least privilege: CI only ever needs to read the tree.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag can be moved by whoever
      # owns the action; a SHA cannot, so a compromised upstream tag cannot quietly
      # start running in this repo. The trailing comment records the human version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - name: Lexicons are in sync
        run: cp lexicons/*.json python/threadlens/data/

      - name: Build (also enforces the 400 KB page budget)
        run: node scripts/build.mjs

      # dist/ is committed so the page works offline and can be downloaded from a
      # release. If a UI change lands without a rebuild, the committed copy is a lie.
      - name: Committed dist matches the sources
        run: |
          git diff --exit-code -- dist/ python/threadlens/data/ \
            || (echo "::error::dist/ or the copied lexicons are stale. Run 'make build' (or 'make sync') and commit the result." && exit 1)

      - name: JS tests
        run: node --test "web/test/*.test.js"

      # pytest shells out to node for the JS<->Python rigor parity check, so node
      # must still be on PATH here.
      - name: Python tests
        run: pip install -e "python[dev]" && cd python && python -m pytest -q
