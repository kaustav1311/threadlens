name: Deploy web app to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:

# The narrowest set that can still publish Pages. No write access to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      # Pinned to commit SHAs so a moved upstream tag cannot change what gets
      # built and published to the live site. Comments record the versions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }

      - name: Test and build
        run: node --test "web/test/*.test.js" && node scripts/build.mjs

      # The published page is rebuilt here from source rather than copied from the
      # committed dist/, so what ships is always what the sources produce.
      - name: Assemble the site
        run: mkdir -p site && cp dist/index.html site/index.html && touch site/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
